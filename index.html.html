<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>덧셈·뺄셈 탐험대 | 혼합형</title><style>
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#223655}*{box-sizing:border-box}body{margin:0;background:#eff6ff;min-height:100dvh}.wrap{max-width:680px;margin:auto;padding:14px 14px 36px}header{text-align:center}h1{font-size:clamp(25px,5vw,36px);margin:8px 0;color:#245da6}.subtitle{color:#58708d;margin:0 0 14px}.card{background:#fff;border-radius:24px;padding:clamp(16px,4vw,30px);box-shadow:0 7px 26px #b9cde850}.hidden{display:none!important}.center{text-align:center}.intro{font-size:19px;line-height:1.8}.info{background:#f0f6ff;border-radius:14px;padding:14px;font-size:16px;line-height:1.7;margin:16px 0}.name{font:inherit;border:2px solid #c3d3ea;border-radius:12px;padding:11px;width:min(100%,260px);margin:7px}.btn{border:0;border-radius:14px;padding:13px 19px;font-size:19px;font-weight:800;background:#286ac3;color:#fff;cursor:pointer;touch-action:manipulation}.btn.secondary{background:#657995}.btn:disabled{opacity:.45;cursor:default}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:17px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:800;font-size:clamp(14px,3vw,18px)}.bar{height:12px;background:#e5edf9;border-radius:10px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:#5c9df2;transition:width .25s}.type{text-align:center;color:#286ac3;font-weight:800;font-size:16px}.equation{font-size:clamp(46px,10vw,76px);font-weight:900;text-align:center;background:#f4f8ff;border-radius:20px;padding:20px 8px;margin:13px 0 17px;white-space:nowrap}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.choice{border:3px solid #b7cdf0;background:#eaf2ff;color:#204c89;border-radius:18px;font-size:clamp(32px,7vw,50px);font-weight:900;min-height:88px;touch-action:manipulation}.choice.good{background:#c9f3d9;border-color:#28a667}.choice.bad{background:#ffe0e2;border-color:#e66877}.message{text-align:center;font-size:20px;font-weight:800;min-height:32px;margin:17px 0 4px}.answerbox{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 auto 15px;min-height:68px}.answer{background:#fff;border:3px solid #b7cdf0;border-radius:16px;min-width:145px;text-align:center;padding:7px 14px;font-size:39px;font-weight:900;min-height:65px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:390px;margin:auto}.key{border:2px solid #c3d4ee;background:#eaf2ff;border-radius:15px;min-height:62px;font-size:29px;font-weight:800;color:#214f8a;touch-action:manipulation}.key.del{background:#fff0e6;color:#9b552e}.key.enter{background:#286ac3;color:#fff;border-color:#286ac3;font-size:21px}.key:disabled{opacity:.5}.small{font-size:14px;color:#66758d;text-align:center;margin:16px 0 0}.stats{font-size:clamp(22px,5vw,29px);font-weight:900;text-align:center;color:#245da6;margin:17px 0}.review{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:20px}.review-item{border-radius:12px;background:#f1f6fd;padding:11px 5px;text-align:center;font-size:18px;font-weight:700}.ok{color:#1d9555}.no{color:#d55365}.badge{display:inline-block;background:#e9f2ff;border-radius:100px;padding:5px 11px;color:#255ba4;font-size:14px;font-weight:800}@media(max-width:420px){.review-item{font-size:15px}.key{min-height:56px}.choice{min-height:74px}}
</style></head><body><div class="wrap"><header><h1>🌟 덧셈·뺄셈 탐험대 🌟</h1><p class="subtitle">계산 실력을 키우고 전략 빙고에 도전해요!</p></header>
<section id="intro" class="card"><div class="center"><span class="badge">초등 1학년 · 20문제</span></div><div class="intro center"><p>🧩 앞의 <b>10문제</b>는 정답 고르기!<br>🔢 뒤의 <b>10문제</b>는 숫자 누르기!</p></div><div class="info">✔ 덧셈 10문제 + 뺄셈 10문제<br>✔ 답을 고르거나 숫자 키패드로 입력해요.<br>✔ 틀린 문제는 마지막에 다시 풀 수 있어요.<br>✔ 선생님께 결과 화면을 보여 주세요.</div><div class="center"><label for="student">이름 (선택)</label><br><input id="student" class="name" maxlength="12" placeholder="이름을 입력해요" autocomplete="off"></div><div class="actions"><button class="btn" id="start">🚀 시작하기</button></div></section>
<section id="quiz" class="card hidden"><div class="top"><span id="progress"></span><span id="score"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="type" id="type"></div><div class="equation" id="equation"></div><div id="choices" class="choices"></div><div id="inputArea" class="hidden"><div class="answerbox"><span style="font-size:20px;font-weight:800">내 답</span><div id="answer" class="answer">?</div></div><div id="keypad" class="keypad"></div></div><div class="message" id="message" aria-live="polite"></div><div class="actions"><button class="btn hidden" id="next">다음 문제 ➜</button></div><p class="small">천천히 계산하고 정답을 선택해요!</p></section>
<section id="result" class="card hidden"><h2 class="center" id="resultTitle"></h2><div class="stats" id="resultStats"></div><div class="info center" id="resultInfo"></div><div class="actions"><button class="btn" id="retry">🔁 틀린 문제 다시 풀기</button><button class="btn secondary" id="restart">🎲 새 문제 20개</button></div><p class="small">선생님께 결과 화면을 보여 주세요.</p><div id="review" class="review"></div></section></div>
<script>
'use strict';const $=id=>document.getElementById(id);const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};let all=[],queue=[],idx=0,correct=0,missed=[],answered=false,round='main',logs=[],typed='';
function generate(){let plus=[],minus=[],used=new Set();for(let op of ['+','−']){let arr=op==='+'?plus:minus,tries=0;while(arr.length<10&&tries++<3000){let a,b,ans;if(op==='+'){a=rnd(2,9);b=rnd(2,9);ans=a+b;if(ans<10||ans>18)continue}else{a=rnd(11,20);b=rnd(2,9);ans=a-b;if(ans<2||ans>18)continue}let key=`${a}${op}${b}`;if(used.has(key))continue;used.add(key);arr.push({a,b,op,ans,key})}}// 선택형과 입력형 각각 덧셈 5개, 뺄셈 5개
let first=shuffle([...plus.slice(0,5),...minus.slice(0,5)]),last=shuffle([...plus.slice(5),...minus.slice(5)]);return [...first,...last].map((q,i)=>({...q,mode:i<10?'choice':'input'}))}
function show(id){['intro','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function begin(fresh){if(fresh){all=generate();queue=[...all];round='main';logs=[]}idx=0;correct=0;missed=[];show('quiz');render()}
function options(ans){let nums=shuffle(Array.from({length:19},(_,i)=>i+2).filter(n=>n!==ans&&Math.abs(n-ans)<=5));while(nums.length<3)nums.push(...shuffle(Array.from({length:19},(_,i)=>i+2).filter(n=>n!==ans&&!nums.includes(n))));return shuffle([ans,...nums.slice(0,3)])}
function render(){answered=false;typed='';let q=queue[idx];$('progress').textContent=`${idx+1} / ${queue.length}문제${round==='retry'?' · 다시 풀기':''}`;$('score').textContent=`맞힌 문제 ${correct}개`;$('fill').style.width=`${idx/queue.length*100}%`;$('type').textContent=q.mode==='choice'?'🧩 정답을 골라요':'🔢 숫자를 눌러 답을 써요';$('equation').textContent=`${q.a} ${q.op} ${q.b} = ?`;$('message').textContent=q.mode==='choice'?'정답을 골라 보세요!':'숫자를 누르고 확인을 눌러요!';$('next').classList.add('hidden');$('choices').classList.toggle('hidden',q.mode!=='choice');$('inputArea').classList.toggle('hidden',q.mode!=='input');$('choices').replaceChildren();if(q.mode==='choice'){options(q.ans).forEach(n=>{let b=document.createElement('button');b.className='choice';b.textContent=n;b.onclick=()=>submit(n,b);$('choices').append(b)})}else{drawAnswer();makeKeys()}}
function drawAnswer(){$('answer').textContent=typed||'?'}
function makeKeys(){let root=$('keypad');root.replaceChildren();['1','2','3','4','5','6','7','8','9','지우기','0','확인'].forEach(v=>{let b=document.createElement('button');b.className='key'+(v==='지우기'?' del':'')+(v==='확인'?' enter':'');b.textContent=v;b.onclick=()=>{if(answered)return;if(v==='지우기')typed=typed.slice(0,-1);else if(v==='확인'){if(typed!=='')submit(Number(typed));return}else if(typed.length<2)typed+=v;drawAnswer()};root.append(b)})}
function submit(n,button){if(answered)return;answered=true;let q=queue[idx],ok=n===q.ans;if(ok)correct++;else missed.push(q);logs.push({key:q.key,round,ok,chosen:n});$('score').textContent=`맞힌 문제 ${correct}개`;if(q.mode==='choice'){[...$('choices').children].forEach(b=>{b.disabled=true;if(Number(b.textContent)===q.ans)b.classList.add('good')});if(!ok&&button)button.classList.add('bad')}else{[...$('keypad').children].forEach(b=>b.disabled=true);$('answer').style.borderColor=ok?'#28a667':'#e66877'}$('message').textContent=ok?'👏 정답! 참 잘했어요!':`😊 정답은 ${q.ans}이에요. 나중에 다시 풀어요!`;$('next').textContent=idx===queue.length-1?'결과 보기 🏆':'다음 문제 ➜';$('next').classList.remove('hidden');$('fill').style.width=`${(idx+1)/queue.length*100}%`}
$('next').onclick=()=>{idx++;if(idx<queue.length)render();else finish()};function finish(){show('result');let name=$('student').value.trim();$('resultTitle').textContent=missed.length?'🎉 끝까지 잘했어요!':'🏆 모두 맞혔어요!';$('resultStats').textContent=`${name?name+' · ':''}${queue.length}문제 중 ${correct}문제 정답!`;$('resultInfo').textContent=missed.length?`다시 풀 문제 ${missed.length}개가 있어요. 한 번 더 도전해요!`:'멋져요! 이제 친구들과 전략 빙고를 해 봐요.';$('retry').classList.toggle('hidden',missed.length===0);$('review').replaceChildren();queue.forEach(q=>{let h=logs.filter(x=>x.round===round&&x.key===q.key).at(-1),d=document.createElement('div');d.className='review-item';d.textContent=`${q.a} ${q.op} ${q.b} = ${q.ans} ${h?.ok?'✓':'↻'}`;d.classList.add(h?.ok?'ok':'no');$('review').append(d)})}
$('start').onclick=()=>begin(true);$('restart').onclick=()=>begin(true);$('retry').onclick=()=>{if(!missed.length)return;queue=[...missed];round='retry';begin(false)};document.addEventListener('keydown',e=>{if($('quiz').classList.contains('hidden')||answered||queue[idx]?.mode!=='input')return;if(e.key>='0'&&e.key<='9'&&typed.length<2){typed+=e.key;drawAnswer()}else if(e.key==='Backspace'){typed=typed.slice(0,-1);drawAnswer()}else if(e.key==='Enter'&&typed)submit(Number(typed))});
</script></body></html>
